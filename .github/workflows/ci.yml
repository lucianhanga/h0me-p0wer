name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Install server deps
        run: npm ci --prefix server --no-audit --no-fund

      - name: Install web deps
        run: npm ci --prefix web --no-audit --no-fund

      - name: Check backend syntax
        run: |
          for f in server/*.js; do node --check "$f"; done

      - name: Build frontend
        run: npm run build --prefix web

      - name: Smoke test (offline mode — no meter, no credentials)
        run: |
          PORT=3100 node server/index.js &
          SERVER_PID=$!
          sleep 4
          curl -sf http://localhost:3100/api/live | grep -q '"connected"'
          curl -sf http://localhost:3100/ | grep -q "<title>h0me-p0wer</title>"
          curl -sf http://localhost:3100/api/stats/overview | grep -q '"ok":true'
          kill -INT $SERVER_PID

      # Mirrors the Docker runtime stage's file layout (server/ + web/dist +
      # root package.json, nothing else) — the v1.5.42 boot crash passed the
      # repo-layout smoke above and only failed in the image. This layout is
      # what must keep booting.
      - name: Smoke test (Docker runtime layout)
        run: |
          rm -rf /tmp/rt-layout && mkdir -p /tmp/rt-layout/web
          cp -r server /tmp/rt-layout/server
          cp -r web/dist /tmp/rt-layout/web/dist
          cp package.json /tmp/rt-layout/package.json
          PORT=3101 DB_PATH=/tmp/rt-layout/data.db node /tmp/rt-layout/server/index.js &
          SERVER_PID=$!
          sleep 4
          curl -sf http://localhost:3101/api/live | grep -q '"connected"'
          curl -sf http://localhost:3101/ | grep -q "<title>h0me-p0wer</title>"
          kill -INT $SERVER_PID
