<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appliance timeline — visualization prototypes</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { background: #0d1117; color: #e8ecef; font: 14px/1.45 system-ui, sans-serif; margin: 0; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 28px 0 4px; color: #9fb0bd; }
  .sub { color: #8b98a5; margin: 0 0 18px; font-size: 13px; }
  .variant { border: 1px solid #30363d; border-radius: 10px; padding: 18px; margin-bottom: 28px; background: #131820; }
  .variant h3 { margin: 0 0 2px; font-size: 16px; }
  .variant .desc { color: #8b98a5; font-size: 12.5px; margin-bottom: 16px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 12px 0 4px; font-size: 12px; color: #9fb0bd; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; background: var(--c); }
  .tip { position: fixed; pointer-events: none; background: #1c2128; border: 1px solid #444c56; border-radius: 8px; padding: 8px 10px; font-size: 12px; color: #c8d0d8; display: none; z-index: 9; max-width: 260px; box-shadow: 0 6px 24px #000a; }
  .tip b { color: #fff; }
  svg text { font-family: system-ui, sans-serif; }
  .axis { fill: #6b7684; font-size: 10px; }
  .daylab { fill: #9fb0bd; font-size: 11px; font-weight: 600; }
  .pick { float: right; background: #238636; color: #fff; border: 0; border-radius: 6px; padding: 6px 14px; font-size: 12.5px; cursor: pointer; }
  .pick:hover { background: #2ea043; }
</style>
</head>
<body>
<h1>Appliance usage timeline — 3 visualization options</h1>
<p class="sub">Same mock data everywhere (3 days × your real big consumers). Hover any block for details: period · avg power · peak power · energy. Click “Choose this one” on your favorite.</p>
<div class="legend" id="legend"></div>
<div id="app"></div>
<div class="tip" id="tip"></div>

<script>
// ---------- mock data: sessions = {day, device, start, end, avgW, peakW, kwh} (start/end = minutes from midnight) ----------
const DEVICES = {
  waschmaschine: "#5fdddd",
  trockner:      "#dd8e5f",
  "spüler":      "#9edd5f",
  cooking:       "#dd5f5f",
};
const DAYS = ["2026-10-20", "2026-10-21", "2026-10-22"];
const SESSIONS = [
  { day: 0, device: "spüler",       start: 7*60+10,  end: 8*60+55,  avgW: 1050, peakW: 1980, kwh: 1.85 },
  { day: 0, device: "waschmaschine",start: 9*60+20,  end: 11*60+40, avgW: 480,  peakW: 2050, kwh: 1.10 },
  { day: 0, device: "cooking",      start: 12*60+5,  end: 12*60+50, avgW: 1400, peakW: 2200, kwh: 1.05 },
  { day: 0, device: "cooking",      start: 18*60+30, end: 19*60+25, avgW: 1200, peakW: 2100, kwh: 0.92 },
  { day: 1, device: "waschmaschine",start: 8*60+5,   end: 10*60+35, avgW: 510,  peakW: 2100, kwh: 1.28 },
  { day: 1, device: "trockner",     start: 10*60+45, end: 12*60+15, avgW: 780,  peakW: 1900, kwh: 1.17 },
  { day: 1, device: "cooking",      start: 12*60+40, end: 13*60+20, avgW: 1350, peakW: 2050, kwh: 0.90 },
  { day: 1, device: "spüler",       start: 20*60+15, end: 22*60+5,  avgW: 980,  peakW: 1950, kwh: 1.80 },
  { day: 2, device: "trockner",     start: 7*60+55,  end: 9*60+30,  avgW: 810,  peakW: 1850, kwh: 1.26 },
  { day: 2, device: "waschmaschine",start: 9*60+40,  end: 12*60+0,  avgW: 495,  peakW: 2150, kwh: 1.16 },
  { day: 2, device: "cooking",      start: 12*60+15, end: 13*60+0,  avgW: 1500, peakW: 2300, kwh: 1.13 },
  { day: 2, device: "cooking",      start: 18*60+45, end: 19*60+35, avgW: 1250, peakW: 2000, kwh: 1.04 },
];
const fmtTime = (m) => `${String(Math.floor(m/60)).padStart(2,"0")}:${String(Math.round(m%60)).padStart(2,"0")}`;
const fmtDur = (a,b) => { const d=b-a; return d>=60 ? `${Math.floor(d/60)}h ${Math.round(d%60)}m` : `${Math.round(d)}m`; };
const tipHtml = (s) => `<b style="color:${DEVICES[s.device]}">${s.device}</b> · ${DAYS[s.day]}<br>` +
  `${fmtTime(s.start)} – ${fmtTime(s.end)} (${fmtDur(s.start,s.end)})<br>` +
  `avg <b>${s.avgW} W</b> · peak <b>${s.peakW} W</b><br>energy <b>${s.kwh.toFixed(2)} kWh</b>`;

const tip = document.getElementById("tip");
function bindTip(el, s) {
  el.addEventListener("mousemove", (e) => {
    tip.innerHTML = tipHtml(s); tip.style.display = "block";
    tip.style.left = Math.min(e.clientX + 14, innerWidth - 280) + "px";
    tip.style.top = (e.clientY + 14) + "px";
  });
  el.addEventListener("mouseleave", () => (tip.style.display = "none"));
}
document.getElementById("legend").innerHTML =
  Object.entries(DEVICES).map(([d,c]) => `<span style="--c:${c}">${d}</span>`).join("");

const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k,v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent.appendChild(e); return e;
}
function variantShell(title, desc) {
  const d = document.createElement("div"); d.className = "variant";
  d.innerHTML = `<button class="pick">Choose this one</button><h3>${title}</h3><div class="desc">${desc}</div>`;
  d.querySelector(".pick").onclick = () => { alert(`You picked: ${title}\n\nTell me which one and I implement the real tab this way.`); };
  document.getElementById("app").appendChild(d);
  return d;
}

/* ================= VARIANT A — vertical day lines (time ↓, days →) ================= */
(function () {
  const W = 860, H = 620, top = 34, bottom = H - 14, left = 70, colW = (W - left - 20) / DAYS.length;
  const y = (m) => top + (m / 1440) * (bottom - top);
  const host = variantShell("A — Vertical day line (your description)",
    "One continuous vertical line per day, time flowing top → bottom. Sessions are colored blocks on the line, device labels to the side.");
  const svg = el("svg", { width: "100%", viewBox: `0 0 ${W} ${H}` }, host);
  for (let h = 0; h <= 24; h += 2) {
    el("line", { x1: left - 8, x2: W - 16, y1: y(h*60), y2: y(h*60), stroke: "#21262d", "stroke-width": 1 }, svg);
    const t = el("text", { x: left - 14, y: y(h*60) + 3, "text-anchor": "end", class: "axis" }, svg);
    t.textContent = `${String(h).padStart(2,"0")}:00`;
  }
  DAYS.forEach((d, i) => {
    const cx = left + colW * i + colW / 2;
    const dl = el("text", { x: cx, y: 18, "text-anchor": "middle", class: "daylab" }, svg);
    dl.textContent = new Date(d + "T12:00").toLocaleDateString("en", { weekday: "short", month: "short", day: "numeric" });
    el("line", { x1: cx, x2: cx, y1: top, y2: bottom, stroke: "#444c56", "stroke-width": 5, "stroke-linecap": "round" }, svg);
    SESSIONS.filter(s => s.day === i).forEach((s, k) => {
      const side = k % 2 === 0 ? -1 : 1; // alternate label sides
      const r = el("rect", {
        x: cx - 9, y: y(s.start), width: 18, height: Math.max(4, y(s.end) - y(s.start)),
        rx: 6, fill: DEVICES[s.device], opacity: 0.9,
      }, svg);
      bindTip(r, s);
      const lx = cx + side * 16;
      const t = el("text", { x: lx, y: (y(s.start) + y(s.end)) / 2 + 3, "text-anchor": side < 0 ? "end" : "start",
        fill: DEVICES[s.device], "font-size": 10.5, "font-weight": 600 }, svg);
      t.textContent = `${s.device} ${fmtTime(s.start)}–${fmtTime(s.end)}`;
      bindTip(t, s);
    });
  });
})();

/* ================= VARIANT B — Gantt (device rows, 24 h axis, one day per strip) ================= */
(function () {
  const devs = Object.keys(DEVICES);
  const rowH = 26, dayH = devs.length * rowH + 30, W = 860, left = 110, right = W - 16;
  const H = 20 + DAYS.length * dayH + 10;
  const x = (m) => left + (m / 1440) * (right - left);
  const host = variantShell("B — Gantt rows per device",
    "One row per appliance, day strips stacked. Easy to compare the same appliance across days; overlaps between appliances are obvious.");
  const svg = el("svg", { width: "100%", viewBox: `0 0 ${W} ${H}` }, host);
  DAYS.forEach((d, i) => {
    const oy = 20 + i * dayH;
    const dl = el("text", { x: left - 8, y: oy + 6, "text-anchor": "end", class: "daylab" }, svg);
    dl.textContent = new Date(d + "T12:00").toLocaleDateString("en", { weekday: "short", month: "short", day: "numeric" });
    for (let h = 0; h <= 24; h += 4) {
      el("line", { x1: x(h*60), x2: x(h*60), y1: oy + 10, y2: oy + 10 + devs.length * rowH, stroke: "#21262d" }, svg);
      if (i === 0) { const t = el("text", { x: x(h*60), y: oy + 6, "text-anchor": "middle", class: "axis" }, svg); t.textContent = `${String(h).padStart(2,"0")}h`; }
    }
    devs.forEach((dev, j) => {
      const ry = oy + 10 + j * rowH;
      const t = el("text", { x: left - 8, y: ry + rowH / 2 + 4, "text-anchor": "end", fill: DEVICES[dev], "font-size": 11 }, svg);
      t.textContent = dev;
      SESSIONS.filter(s => s.day === i && s.device === dev).forEach((s) => {
        const r = el("rect", { x: x(s.start), y: ry + 4, width: Math.max(4, x(s.end) - x(s.start)), height: rowH - 9,
          rx: 5, fill: DEVICES[dev], opacity: 0.85 }, svg);
        bindTip(r, s);
        if (x(s.end) - x(s.start) > 90) {
          const lt = el("text", { x: (x(s.start) + x(s.end)) / 2, y: ry + rowH / 2 + 3, "text-anchor": "middle", fill: "#0d1117", "font-size": 9.5, "font-weight": 700 }, svg);
          lt.textContent = `${s.kwh.toFixed(1)} kWh`; bindTip(lt, s);
        }
      });
    });
  });
})();

/* ================= VARIANT C — stacked 24 h ribbon per day (continuous river) ================= */
(function () {
  const W = 860, H = 560, top = 30, bottom = H - 30, left = 64, colW = (W - left - 20) / DAYS.length;
  const y = (m) => top + (m / 1440) * (bottom - top);
  const host = variantShell("C — Continuous day ribbon",
    "Each day is ONE continuous ribbon: quiet time is a thin dark core, any big appliance running widens it into a colored block. Closest to a 'power signature' of the day.");
  const svg = el("svg", { width: "100%", viewBox: `0 0 ${W} ${H}` }, host);
  for (let h = 0; h <= 24; h += 2) {
    const t = el("text", { x: left - 12, y: y(h*60) + 3, "text-anchor": "end", class: "axis" }, svg);
    t.textContent = `${String(h).padStart(2,"0")}:00`;
  }
  DAYS.forEach((d, i) => {
    const cx = left + colW * i + colW / 2;
    const dl = el("text", { x: cx, y: 16, "text-anchor": "middle", class: "daylab" }, svg);
    dl.textContent = new Date(d + "T12:00").toLocaleDateString("en", { weekday: "short", month: "short", day: "numeric" });
    el("line", { x1: cx, x2: cx, y1: top, y2: bottom, stroke: "#21262d", "stroke-width": 22, "stroke-linecap": "round" }, svg);
    // quiet core
    el("line", { x1: cx, x2: cx, y1: top, y2: bottom, stroke: "#30363d", "stroke-width": 6, "stroke-linecap": "round" }, svg);
    SESSIONS.filter(s => s.day === i).forEach((s) => {
      const w = 10 + Math.min(26, s.peakW / 80); // width encodes peak power
      const r = el("rect", { x: cx - w/2, y: y(s.start), width: w, height: Math.max(5, y(s.end) - y(s.start)),
        rx: w/2, fill: DEVICES[s.device], opacity: 0.92 }, svg);
      bindTip(r, s);
      if (y(s.end) - y(s.start) > 26) {
        const t = el("text", { x: cx, y: (y(s.start)+y(s.end))/2 + 3, "text-anchor": "middle", fill: "#0d1117", "font-size": 9, "font-weight": 700 }, svg);
        t.textContent = s.device; bindTip(t, s);
      }
    });
    // day energy summary
    const tot = SESSIONS.filter(s => s.day === i).reduce((a,s) => a + s.kwh, 0);
    const st = el("text", { x: cx, y: bottom + 20, "text-anchor": "middle", class: "axis", "font-size": 11 }, svg);
    st.textContent = `Σ ${tot.toFixed(1)} kWh`;
  });
})();
</script>
</body>
</html>
