<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appliance timeline — mobile options</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { background: #0d1117; color: #e8ecef; font: 14px/1.45 system-ui, sans-serif; margin: 0; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #8b98a5; margin: 0 0 20px; font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .opt h3 { margin: 0 0 2px; font-size: 15px; }
  .opt .desc { color: #8b98a5; font-size: 12.5px; margin: 0 0 10px; max-width: 390px; }
  .phone { width: 390px; border: 2px solid #30363d; border-radius: 18px; background: #131820; padding: 12px; overflow: hidden; }
  .pick { background: #238636; color: #fff; border: 0; border-radius: 6px; padding: 6px 14px; font-size: 12.5px; cursor: pointer; margin-bottom: 10px; }
  .pick:hover { background: #2ea043; }
  .tip { position: fixed; pointer-events: none; background: #1c2128; border: 1px solid #444c56; border-radius: 8px; padding: 8px 10px; font-size: 12px; color: #c8d0d8; display: none; z-index: 9; max-width: 280px; box-shadow: 0 6px 24px #000a; }
  .tip b { color: #fff; }
  svg text { font-family: system-ui, sans-serif; }
  /* M1 feed */
  .m1-day { margin-bottom: 14px; }
  .m1-daylabel { color: #9fb0bd; font-size: 12px; font-weight: 700; margin: 0 0 6px; }
  .m1-row { display: flex; align-items: center; gap: 10px; background: #0d1117; border: 1px solid #21262d; border-radius: 10px; padding: 9px 11px; margin-bottom: 6px; }
  .m1-dot { width: 10px; height: 38px; border-radius: 5px; background: var(--c); flex: none; }
  .m1-main { flex: 1; min-width: 0; }
  .m1-name { font-weight: 600; font-size: 13.5px; color: var(--c); }
  .m1-time { color: #9fb0bd; font-size: 12px; }
  .m1-nums { text-align: right; font-size: 12px; color: #c8d0d8; flex: none; }
  .m1-nums b { color: #fff; font-size: 13px; }
  .m1-sub { color: #6b7684; font-size: 11px; }
</style>
</head>
<body>
<h1>Appliance timeline — mobile-first options</h1>
<p class="sub">Same mock data, every frame is 390 px (a phone). Hover (or imagine tap) for full values. Pick your favorite.</p>
<div class="row" id="app"></div>
<div class="tip" id="tip"></div>

<script>
const DEVICES = { waschmaschine:"#5fdddd", trockner:"#dd8e5f", "spüler":"#9edd5f", cooking:"#dd5f5f" };
const DAYS = ["2026-10-21", "2026-10-22"];
const SESSIONS = [
  { day: 0, device: "waschmaschine",start: 8*60+5,   end: 10*60+35, avgW: 510,  peakW: 2100, kwh: 1.28 },
  { day: 0, device: "trockner",     start: 10*60+45, end: 12*60+15, avgW: 780,  peakW: 1900, kwh: 1.17 },
  { day: 0, device: "cooking",      start: 12*60+40, end: 13*60+20, avgW: 1350, peakW: 2050, kwh: 0.90 },
  { day: 0, device: "spüler",       start: 20*60+15, end: 22*60+5,  avgW: 980,  peakW: 1950, kwh: 1.80 },
  { day: 1, device: "waschmaschine",start: 8*60+23,  end: 11*60+42, avgW: 446,  peakW: 2314, kwh: 1.48 },
  { day: 1, device: "spüler",       start: 10*60+3,  end: 10*60+46, avgW: 654,  peakW: 2282, kwh: 0.46 },
  { day: 1, device: "trockner",     start: 10*60+14, end: 14*60+37, avgW: 326,  peakW: 543,  kwh: 1.43 },
  { day: 1, device: "spüler",       start: 11*60+6,  end: 11*60+39, avgW: 811,  peakW: 2186, kwh: 0.44 },
  { day: 1, device: "cooking",      start: 17*60+24, end: 18*60+15, avgW: 826,  peakW: 2387, kwh: 0.70 },
];
const fmtTime = (m) => `${String(Math.floor(m/60)).padStart(2,"0")}:${String(Math.round(m%60)).padStart(2,"0")}`;
const fmtDur = (a,b) => { const d=b-a; return d>=60 ? `${Math.floor(d/60)}h ${String(Math.round(d%60)).padStart(2,"0")}m` : `${Math.round(d)} min`; };
const tipHtml = (s) => `<b style="color:${DEVICES[s.device]}">${s.device}</b> · ${DAYS[s.day]}<br>period <b>${fmtTime(s.start)}–${fmtTime(s.end)}</b> (${fmtDur(s.start,s.end)})<br>avg <b>${s.avgW} W</b> · peak <b>${s.peakW} W</b> · <b>${s.kwh.toFixed(2)} kWh</b>`;
const tip = document.getElementById("tip");
function bindTip(el, s) {
  el.addEventListener("mousemove", (e) => { tip.innerHTML = tipHtml(s); tip.style.display = "block";
    tip.style.left = Math.min(e.clientX + 14, innerWidth - 300) + "px"; tip.style.top = (e.clientY + 14) + "px"; });
  el.addEventListener("mouseleave", () => (tip.style.display = "none"));
}
function shell(title, desc) {
  const d = document.createElement("div"); d.className = "opt";
  d.innerHTML = `<h3>${title}</h3><p class="desc">${desc}</p>`;
  const btn = document.createElement("button"); btn.className = "pick"; btn.textContent = "Choose this one";
  btn.onclick = () => alert(`You picked: ${title}`);
  const phone = document.createElement("div"); phone.className = "phone";
  d.appendChild(btn); d.appendChild(phone);
  document.getElementById("app").appendChild(d);
  return phone;
}
const dayLabel = (d) => new Date(d + "T12:00").toLocaleDateString("en", { weekday: "short", month: "short", day: "numeric" });

/* ============ M1 — day feed (chronological cards) ============ */
(function () {
  const phone = shell("M1 — Day feed", "Pure list: per day a chronological stack of session cards with everything inline. Scrolls naturally, nothing squishes.");
  DAYS.forEach((d, i) => {
    const wrap = document.createElement("div"); wrap.className = "m1-day";
    wrap.innerHTML = `<p class="m1-daylabel">${dayLabel(d)}</p>`;
    SESSIONS.filter(s => s.day === i).sort((a,b) => a.start - b.start).forEach((s) => {
      const row = document.createElement("div"); row.className = "m1-row"; row.style.setProperty("--c", DEVICES[s.device]);
      row.innerHTML = `<div class="m1-dot"></div>
        <div class="m1-main"><div class="m1-name">${s.device}</div>
        <div class="m1-time">${fmtTime(s.start)} – ${fmtTime(s.end)} · ${fmtDur(s.start, s.end)}</div>
        <div class="m1-sub">avg ${s.avgW} W · peak ${s.peakW} W</div></div>
        <div class="m1-nums"><b>${s.kwh.toFixed(2)}</b> kWh</div>`;
      bindTip(row, s);
      wrap.appendChild(row);
    });
    phone.appendChild(wrap);
  });
})();

/* ============ M2 — vertical timeline (center line, sessions alternate sides) ============ */
(function () {
  const phone = shell("M2 — Vertical timeline", "Your original 'vertical line' idea, per day: time flows down, sessions branch off a center line. Tall but phone-native scrolling.");
  const SVGNS = "http://www.w3.org/2000/svg";
  const el = (t, a, p) => { const e = document.createElementNS(SVGNS, t); for (const [k,v] of Object.entries(a)) e.setAttribute(k,v); p.appendChild(e); return e; };
  DAYS.forEach((d, i) => {
    const dayS = SESSIONS.filter(s => s.day === i);
    const minS = Math.min(...dayS.map(s => s.start)) - 45, maxE = Math.max(...dayS.map(s => s.end)) + 30;
    const H = Math.max(200, (maxE - minS) * 1.1);
    const Wp = 366, cx = 84, y = (m) => 26 + ((m - minS) / (maxE - minS)) * (H - 40);
    const svg = el("svg", { width: "100%", viewBox: `0 0 ${Wp} ${H}` }, phone);
    const dl = el("text", { x: 6, y: 14, fill: "#9fb0bd", "font-size": 12, "font-weight": 700 }, svg);
    dl.textContent = dayLabel(d);
    el("line", { x1: cx, x2: cx, y1: 24, y2: H - 12, stroke: "#444c56", "stroke-width": 4, "stroke-linecap": "round" }, svg);
    for (let h = Math.ceil(minS / 60); h <= maxE / 60; h++) {
      const t = el("text", { x: 6, y: y(h*60) + 3, fill: "#6b7684", "font-size": 9.5 }, svg);
      t.textContent = `${String(h).padStart(2,"0")}:00`;
      el("line", { x1: cx - 5, x2: cx + 5, y1: y(h*60), y2: y(h*60), stroke: "#444c56", "stroke-width": 1.5 }, svg);
    }
    dayS.sort((a,b) => a.start - b.start).forEach((s) => {
      const r = el("rect", { x: cx - 8, y: y(s.start), width: 16, height: Math.max(6, y(s.end) - y(s.start)), rx: 7, fill: DEVICES[s.device], opacity: 0.92 }, svg);
      bindTip(r, s);
      const my = (y(s.start) + y(s.end)) / 2;
      const t1 = el("text", { x: cx + 16, y: my - 2, fill: DEVICES[s.device], "font-size": 11.5, "font-weight": 600 }, svg);
      t1.textContent = s.device; bindTip(t1, s);
      const t2 = el("text", { x: cx + 16, y: my + 11, fill: "#8b98a5", "font-size": 9.5 }, svg);
      t2.textContent = `${fmtTime(s.start)}–${fmtTime(s.end)} · ${fmtDur(s.start, s.end)} · ${s.kwh.toFixed(2)} kWh`;
      bindTip(t2, s);
      const t3 = el("text", { x: cx + 16, y: my + 23, fill: "#6b7684", "font-size": 9 }, svg);
      t3.textContent = `avg ${s.avgW} W · peak ${s.peakW} W`;
    });
  });
})();

/* ============ M3 — rotated Gantt (time ↓, devices →) ============ */
(function () {
  const phone = shell("M3 — Rotated Gantt", "The desktop Gantt turned 90°: hours run down the side, each appliance is a column. Narrow columns, but the full day stays visible without zooming.");
  const SVGNS = "http://www.w3.org/2000/svg";
  const el = (t, a, p) => { const e = document.createElementNS(SVGNS, t); for (const [k,v] of Object.entries(a)) e.setAttribute(k,v); p.appendChild(e); return e; };
  const devs = Object.keys(DEVICES);
  const Wp = 366, left = 44, colW = (Wp - left - 8) / devs.length;
  DAYS.forEach((d, i) => {
    const dayS = SESSIONS.filter(s => s.day === i);
    const minS = Math.min(...dayS.map(s => s.start)) - 30, maxE = Math.max(...dayS.map(s => s.end)) + 20;
    const H = 44 + (maxE - minS) * 0.75;
    const y = (m) => 30 + ((m - minS) / (maxE - minS)) * (H - 48);
    const svg = el("svg", { width: "100%", viewBox: `0 0 ${Wp} ${H}` }, phone);
    const dl = el("text", { x: 6, y: 15, fill: "#9fb0bd", "font-size": 12, "font-weight": 700 }, svg);
    dl.textContent = dayLabel(d);
    for (let h = Math.ceil(minS / 60); h <= maxE / 60; h += 2) {
      const t = el("text", { x: 38, y: y(h*60) + 3, "text-anchor": "end", fill: "#6b7684", "font-size": 9 }, svg);
      t.textContent = `${String(h).padStart(2,"0")}h`;
      el("line", { x1: left, x2: Wp - 8, y1: y(h*60), y2: y(h*60), stroke: "#21262d" }, svg);
    }
    devs.forEach((dev, j) => {
      const cx = left + colW * j + colW / 2;
      const t = el("text", { x: cx, y: 26, "text-anchor": "middle", fill: DEVICES[dev], "font-size": 9.5, "font-weight": 600 }, svg);
      t.textContent = dev.length > 9 ? dev.slice(0, 8) + "…" : dev;
      el("line", { x1: cx, x2: cx, y1: 30, y2: H - 14, stroke: "#21262d", "stroke-width": 12, "stroke-linecap": "round" }, svg);
      dayS.filter(s => s.device === dev).forEach((s) => {
        const r = el("rect", { x: cx - 11, y: y(s.start), width: 22, height: Math.max(7, y(s.end) - y(s.start)), rx: 8, fill: DEVICES[dev], opacity: 0.9 }, svg);
        bindTip(r, s);
        const kwhT = el("text", { x: cx, y: (y(s.start)+y(s.end))/2 + 3, "text-anchor": "middle", fill: "#0d1117", "font-size": 8.5, "font-weight": 800 }, svg);
        if (y(s.end) - y(s.start) > 16) { kwhT.textContent = s.kwh.toFixed(1); bindTip(kwhT, s); }
      });
    });
  });
})();

/* ============ M4 — proportional 24 h strip + compact list ============ */
(function () {
  const phone = shell("M4 — 24 h strip + list", "Per day: one slim 24-hour strip shows WHEN things ran (proportionally), a compact list under it carries the numbers. Overview + detail split.");
  DAYS.forEach((d, i) => {
    const dayS = SESSIONS.filter(s => s.day === i);
    const wrap = document.createElement("div"); wrap.style.marginBottom = "14px";
    wrap.innerHTML = `<p class="m1-daylabel">${dayLabel(d)}</p>`;
    const SVGNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("width", "100%"); svg.setAttribute("viewBox", "0 0 366 40");
    const el = (t, a) => { const e = document.createElementNS(SVGNS, t); for (const [k,v] of Object.entries(a)) e.setAttribute(k,v); svg.appendChild(e); return e; };
    const X = (m) => 6 + (m / 1440) * (366 - 12);
    el("rect", { x: 6, y: 8, width: 354, height: 18, rx: 9, fill: "#21262d" });
    [0, 6, 12, 18, 24].forEach((h) => {
      const t = el("text", { x: X(h*60), y: 38, "text-anchor": "middle", fill: "#6b7684", "font-size": 8.5 });
      t.textContent = `${String(h).padStart(2,"0")}h`;
    });
    dayS.forEach((s) => {
      const r = el("rect", { x: X(s.start), y: 10, width: Math.max(3, X(s.end) - X(s.start)), height: 14, rx: 6, fill: DEVICES[s.device], opacity: 0.9 });
      bindTip(r, s);
    });
    wrap.appendChild(svg);
    dayS.sort((a,b) => a.start - b.start).forEach((s) => {
      const row = document.createElement("div");
      row.style.cssText = "display:flex;justify-content:space-between;font-size:11.5px;color:#9fb0bd;padding:2px 4px;";
      row.innerHTML = `<span style="color:${DEVICES[s.device]};font-weight:600">${s.device}</span>
        <span>${fmtTime(s.start)}–${fmtTime(s.end)} (${fmtDur(s.start,s.end)}) · ${s.avgW}/${s.peakW} W · <b style="color:#e8ecef">${s.kwh.toFixed(2)} kWh</b></span>`;
      bindTip(row, s);
      wrap.appendChild(row);
    });
    phone.appendChild(wrap);
  });
})();
</script>
</body>
</html>
